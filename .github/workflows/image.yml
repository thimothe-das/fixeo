# Deux images depuis le meme Dockerfile, au meme sha.
#
#   fixeo          l'application, en mode standalone
#   fixeo-migrate  drizzle-kit avec ses node_modules complets
#
# Le meme sha pour les deux n'est pas cosmetique : il rend impossible de
# migrer la base avec une version du schema et de servir l'application avec
# une autre.
name: image

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Application
        uses: docker/build-push-action@v6
        with:
          context: .
          target: run
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fixeo:main
            ghcr.io/${{ github.repository_owner }}/fixeo:main-${{ github.sha }}
          cache-from: type=gha,scope=fixeo
          cache-to: type=gha,mode=max,scope=fixeo

      - name: Migrations
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fixeo-migrate:main
            ghcr.io/${{ github.repository_owner }}/fixeo-migrate:main-${{ github.sha }}
          # Meme scope de cache : les deux cibles partagent les etages `deps`
          # et `build`, qui sont l'essentiel du temps de construction.
          cache-from: type=gha,scope=fixeo
          cache-to: type=gha,mode=max,scope=fixeo

      - run: |
          echo "### Images publiees" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository_owner }}/fixeo:main-${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository_owner }}/fixeo-migrate:main-${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
