# Deux images depuis le meme Dockerfile, au meme sha.
#
#   fixeo          l'application, en mode standalone
#   fixeo-migrate  drizzle-kit avec ses node_modules complets
#
# Le meme sha pour les deux n'est pas cosmetique : il rend impossible de
# migrer la base avec une version du schema et de servir l'application avec
# une autre.
name: image

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Application
        uses: docker/build-push-action@v6
        with:
          context: .
          target: run
          platforms: linux/amd64
          push: true
          # Secret de CONSTRUCTION, pas variable d'environnement : monte en
          # tmpfs le temps du `RUN`, jamais ecrit dans un calque, absent de
          # `docker history`.
          #
          # `/pricing` porte `revalidate = 3600` : elle est prerendue au build
          # avec les vrais tarifs. La cle doit donc reellement joindre Stripe.
          # Elle est RESTREINTE en lecture sur Products et Prices — ce depot
          # est public, et une cle qui ne sait que lire des tarifs affiches
          # publiquement n'ajoute rien a ce qui est deja visible.
          secrets: |
            stripe=${{ secrets.STRIPE_RESTRICTED_KEY }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/fixeo:main
            ghcr.io/${{ github.repository_owner }}/fixeo:main-${{ github.sha }}
          cache-from: type=gha,scope=fixeo
          cache-to: type=gha,mode=max,scope=fixeo

      - name: Migrations
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fixeo-migrate:main
            ghcr.io/${{ github.repository_owner }}/fixeo-migrate:main-${{ github.sha }}
          # Meme scope de cache : les deux cibles partagent les etages `deps`
          # et `build`, qui sont l'essentiel du temps de construction.
          cache-from: type=gha,scope=fixeo
          cache-to: type=gha,mode=max,scope=fixeo
          # Le meme secret, parce que `migrate` derive de l'etage `build`. Sans
          # lui, un cache manquant ferait rejouer `pnpm build` sans la cle et
          # cette cible echouerait alors que la premiere a reussi — un echec
          # intermittent, donc le plus couteux a diagnostiquer.
          secrets: |
            stripe=${{ secrets.STRIPE_RESTRICTED_KEY }}

      - run: |
          echo "### Images publiees" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository_owner }}/fixeo:main-${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository_owner }}/fixeo-migrate:main-${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
