services:
  postgres:
    # Majeure epinglee, correctifs suivis : 16.4-alpine etait fige depuis
    # 2024-08-08 (746 j, 7 CVE critiques corrigeables). Ne pas repasser sur une
    # version exacte, elle regelerait. Ne pas passer a 17 non plus : changement
    # de majeure = pg_upgrade.
    image: postgres:16-alpine
    container_name: postgres_fixeo
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5436:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

    # Plafonds. Mesure du 2026-08-25 : ce conteneur tournait sans aucune limite
    # sur une VM de 9,7 Go, alors qu'il consomme 18 Mo au repos. Une base sans
    # plafond, c'est le voisin qui tombe quand une requete derape.
    # 512 Mo est large ici ; a relever si des jeux de donnees reels arrivent.
    # Pas de cap_drop : l'entrypoint de l'image postgres demarre en root pour
    # chowner puis bascule sur uid 70 via gosu, ce qui exige SETUID/SETGID/CHOWN.
    # Le gain serait nul de toute facon, PID 1 tourne deja avec CapEff a zero.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          # Sous `deploy.resources.limits` et pas en `pids_limit:` racine :
          # Compose refuse les deux a la fois (« can't set distinct values »),
          # meme piege que mealie et bank-scraper. 256 est large : postgres
          # plafonne deja ses processus par max_connections.
          pids: 256
        reservations:
          memory: 128M
